# The key programs talk to the secure world through /dev/qseecom, which the
# phone's own init opens to the drmrpc group (OrangeFox's
# recovery/root/init.recovery.qcom.rc:40-41 does the same chmod and chown).
# The phone's recovery has no /dev/qseecom: this kernel's secure world
# is reached through /dev/smcinvoke. Naming a node the modules never make
# waits 5 s and ends the bring-up, so this table stays out.
# user = "system"
# group = "drmrpc"
# mode = 0o660
# paths = ["/dev/qseecom"]

[partitions]
# The stock fstab mounts persist at /persist and /mnt/vendor/persist
# (d-device-evidence.md).
mounted = ["persist"]

[firmware]
# modem_a=sde6 is mounted as /firmware in recovery and as
# /vendor/firmware_mnt in system (e-firmware-derived.md).
partition = "modem"

# Touch: the IC is a Synaptics S3910 (oplus_bsp_tp_custom...synaptics-s3910
# in the command line), but OPPO's touch readiness runs through touchDaemon /
# vendor.touch-aidl-1, not Xiaomi's touch_dev layer, so what a recovery has
# to write has to be tried on the phone first. Left off; candidates below.
# [touch]
# writes = []

# Haptics: lra_frequency_hz stays 0 in recovery (the richTap service
# calibrates the motor through its own ioctl, not this node), but the
# driver does report the resonant period in t_lra_us: 5882 us is 170 Hz,
# the same frequency richTap calibrates to. Play Skyward's clicks and ticks
# through the qcom-hv-haptics force-feedback device (/dev/input/event4).
[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
period = "/sys/class/qcom-haptics/t_lra_us"
strength = { lightest = 0.4, strongest = 1.0 }

# The modem (mss) is NOT started here, unlike the Ace 6 port. On this phone
# the recovery's own init powers up both remoteproc0 (audio DSP) and
# remoteproc1 (modem) during bring-up, before this recovery's programs run:
# the log shows "remoteproc1: ...mss is now up" ahead of any service here.
# Writing "start" again to an already-running modem makes its firmware stall:
# cnss then cannot get the DMS QMI service and the modem's DOG watchdog
# fires "stalled initialization", which with rproc recovery disabled crashes
# the whole device. So the one-shot the Ace 6 needs is left out on this phone.

# WLAN: Qualcomm's Kiwi on PCIe, driven by qca_cld3_kiwi_v2 over the cnss2
# platform driver. This is the verified chain from the Ace 6 port, whose
# code is the same as this recovery's. Three modules, in this order:
#
#   rfkill    a kernel module on system_dlkm, not in the vendor modules.dep;
#             cfg80211 is refused with unknown rfkill symbols without it.
#             Measured present at /system_dlkm/flatten/lib/modules/rfkill.ko.
#   cfg80211  which kiwi_v2 depends on; left out, the driver is refused with
#             unknown cfg80211 symbols.
#   qca_cld3_kiwi_v2
#
# Once fs_ready is written, cnss2 powers the chip up and loads its firmware
# from the modem partition, and wlan0 appears. The interface wait in
# skyward/src/wlan.rs is 60 s to sit through cnss2's connect-fall-back-retry.
# The ini is on the vendor partition at /vendor/etc/wifi/kiwi_v2. Only the
# cnss readiness node exists on this kernel (there is no /sys/kernel/icnss).
[wlan]
modules = ["rfkill", "cfg80211", "qca_cld3_kiwi_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/kiwi_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/kiwi_v2/WCNSS_qcom_cfg.ini" },
    { name = "wlan/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/kiwi_v2/WCNSS_qcom_cfg.ini" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
# The phone built wpa_supplicant against the full OpenSSL 1.1 libcrypto,
# which exports the old "sk_dup" symbol. The ramdisk's /system/lib64 copy is
# a newer BoringSSL that only has "OPENSSL_sk_dup", so a wpa started with
# /system/lib64 first fails to link: "cannot locate symbol sk_dup". The
# system partition's own copy at /mnt/system/system/lib64 (mounted by the
# decryption chain) does export "sk_dup". Put it first so the supplicant
# loads that one; /vendor/lib64 carries the OPLUS/QTI WiFi NDK libraries.
libraries = ["/mnt/system/system/lib64", "/vendor/lib64", "/system/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# [update] stays out: realme's update protocol is not researched, and
# without the section the update page hides itself (skyward/src/ui.rs:1548).

# One-shot as root: /vendor/bin/ exists on the real phone. Whether this
# script is the dispatcher the dada comment describes is still to be
# verified on the phone.
# The post_boot script this table used to start ends with status 1 on the phone,
# and that ends the bring-up before the key programs start, so it stays out
# until the script's own failure is understood.
# [[service]]
# path = "/vendor/bin/sh"
# args = ["/vendor/bin/init.kernel.post_boot.sh"]
# libraries = ["/system/lib64", "/vendor/lib64"]
# oneshot = true
# user = "root"
# groups = ["root", "system", "wakelock", "graphics"]

# Vibration: OrangeFox starts vendor.oplus.vibrator from
# init.recovery.qcom.rc on twrp.modules.loaded=true, which a recovery that
# is not OrangeFox never sets. Its richTap service calibrates the motor's
# resonance (f0), then registers android.hardware.vibrator.IVibrator/default.
# Without it lra_frequency_hz reads 0 and no waveform can be made. Start the
# same service with the environment its own /odm/etc/init/vibrator-default.rc
# gives it; libraries under /odm and /vendor are added by the starter.
[[service]]
path = "/odm/bin/hw/vendor.oplus.hardware.vibrator-service"
libraries = ["/odm/lib64", "/vendor/lib64", "/mnt/system/system/lib64"]
environment = [
    ["RICHTAP_DEVICE_PATH", "/dev/awinic_haptic"],
    ["ENV_RICHTAP_CONFIG_PATH", "/odm/etc/aac_richtap.config"],
]
user = "system"
groups = ["system", "input"]

[stock]
version = "14.1.0.181"
# The local full update package, an absolute path on the packer's host.
package = "J:/RMX3800_14.1.0.181(CN01).zip"
recovery = "0dcc9fe5bb0579c979bdbd1b8541c86a5343ef972a1711997ba3bab29382482e"
