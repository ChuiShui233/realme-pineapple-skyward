# divo — realme GT6 (RMX3800), the Chinese build's recovery.
#
# Every value cites where it was measured: docs/phase1/d-device-evidence.md
# (the real phone) and docs/phase1/e-firmware-derived.md (the official full
# package), with docs/phase1/README.md §3.2 as the draft this file settles.

[device]
# The kernel command line names the project oplusboot.prjname=23631, which
# the variant script maps to divo (d-device-evidence.md).
codename = "divo"
# The official odm build.prop (e-firmware-derived.md).
brand = "realme"
model = "realme GT6 (RMX3800)"
# ota-type=AB; the production code probes androidboot.slot_suffix.
ab = true
soc = { hans = "第三代骁龙8移动平台", hant = "Snapdragon 8 Gen 3", en = "Snapdragon 8 Gen 3 Mobile Platform" }
# The Snapdragon 8 Gen 3's X4 core tops out at 3.30 GHz (3302400 kHz, the
# value cpuinfo_max_freq settles on). In this recovery the specs page shows
# 6.60 GHz instead, so pin the known-correct frequency for display.
cpu_max_khz = 3302400
# ro.build.display.id is the build baseline (RMX3800_11_A.01), identical
# across two packages, while ro.build.version.ota is what actually changes
# with the version and matches the OTA metadata (e-firmware-derived.md §3).
os_version_prop = "ro.build.version.ota"
# ro.product.mod_device is empty on realme (d-device-evidence.md §5b). The
# update page reads the device name from ro.product.model instead, which the
# official odm build.default.prop sets to RMX3800 (e-firmware-derived.md).
mod_device_prop = "ro.product.model"
# Who ported Skyward to this phone, shown on the About page under the
# Android version.
porter = "吹水明月"
# The gauge IC stays asleep until the ADSP that owns it is restarted, as
# OrangeFox does on pineapple (init.recovery.qcom.rc): once the modules are
# loaded, write ssr and then wait for the battery to appear.
writes = [
    { path = "/sys/kernel/boot_adsp/ssr", value = "1" },
]
battery_wait_seconds = 6

[display]
# The wm size physical value; the system's 1080x2376 is only a user override.
width = 1264
height = 2780
density = 560
# Marketed diagonal from the official spec sheet; only used for vertical
# layouts, and not yet confirmed on the phone (d-device-evidence.md).
diagonal = 6.78
# DisplayInfo roundedCorners radius (d-device-evidence.md).
corner_radius = 125
# The stock init.recovery.qcom.rc writes raw 200 of the panel's 4094 steps
# (about 5%), and the stock recovery lights the panel itself afterwards.
# Skyward starts at half the panel's normal maximum
# (oplus,dsi-bl-normal-max-level 3598, below the HBM range the slider must
# not reach), so the pages are readable; the slider keeps its top at that
# normal maximum.
brightness = 50

[modules]
# The four partitions the phone keeps its .ko files on, as measured on the
# stock vendor_boot / super layout (e-firmware-derived.md).
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The stock modules.load.recovery verbatim, deduplicated: the stock file
# holds 401 lines and names smcinvoke_dlkm.ko twice, so 400 entries remain.
